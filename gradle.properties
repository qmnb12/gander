org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Gradle 9.6.1 requires AGP 9.x. Keep legacy Kotlin plugin and DSL enabled
# while preserving this project's existing kotlinOptions configuration.
android.builtInKotlin=false
android.newDsl=false
# R8 shrinks resources together with the code that uses them, so a library layout nothing opens no
# longer keeps its classes in the app, as one kept Material's date picker. The default from AGP 9.
android.r8.optimizedResourceShrinking=true
